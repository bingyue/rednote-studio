services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATA_DIR: /app/runtime
      AI_MODE: ${AI_MODE:-mock}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4.1-mini}
      STUDIO_ACCESS_TOKEN: ${STUDIO_ACCESS_TOKEN:-}
      ALLOWED_ORIGINS: http://127.0.0.1:8088,http://localhost:8088
      ALLOWED_HOSTS: api,localhost,127.0.0.1
    volumes:
      - studio-data:/app/runtime
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  studio-data:
